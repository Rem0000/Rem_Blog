# Java 版 Docker 部署用的 Nginx 站点配置
# 挂载到容器：/etc/nginx/conf.d/default.conf
# 前端产物：../../ui/{blog,admin}/dist（deploy/build-frontends.sh 生成）

server {
    listen 80;
    server_name _;

    # 与 Spring 的 multipart 限制（单文件 20MB / 请求 25MB）对齐
    client_max_body_size 25m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # ---------- 博客前台 ----------
    location / {
        root /usr/share/nginx/html/blog/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ---------- 后台管理端（hash 路由，必须挂在 /admin/）----------
    location = /admin {
        return 301 /admin/;
    }

    location /admin {
        alias /usr/share/nginx/html/admin/dist;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # ---------- 后端接口（剥掉 /api 前缀）----------
    location /api/ {
        proxy_pass http://blog-java-server:8888/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- WebSocket（聊天，独立端口 8889）----------
    location /ws/ {
        proxy_pass http://blog-java-server:8889/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ---------- 网易云音乐接口（可选，--profile music）----------
    # 用变量 + Docker 内置 DNS 延迟解析：没启动 netease 容器时 nginx 也能正常启动，
    # 只是访问音乐页返回 502。
    location /wapi/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $music_upstream http://netease-music-api:3000;
        rewrite ^/wapi/(.*)$ /$1 break;
        proxy_pass $music_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
