# Java 后端（Spring Boot）Docker 全栈：MySQL + 后端 + 前端 Nginx
#
# 用法（推荐用 deploy/setup-java-docker.sh，它会自动生成 .env 并构建前端）：
#   cd deploy/java
#   cp .env.example .env && vi .env
#   docker compose --env-file .env up -d --build
#
# 如果机器上还留着旧的 Node 后端/Docker 栈，先停掉（都会占 80/8888/8889）。
#
# 前端产物来自 deploy/build-frontends.sh：ui/{blog,admin}/dist
name: blog-java

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 deploy/java/.env 里设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB:-online_blog}
      MYSQL_USER: ${MYSQL_USER:-blog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 deploy/java/.env 里设置 MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      # 只挂主库结构；seed-demo.sql 是联调演示数据，不自动导入
      - ../../blog-java-server/sql/online_blog.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - blog-network

  blog-java-server:
    build:
      # 上下文是仓库根目录（my-blog/）：Dockerfile 需要同时拿到 blog-java-server 与 deploy/java
      context: ../..
      dockerfile: deploy/java/Dockerfile
      args:
        MAVEN_MIRROR: ${MAVEN_MIRROR:-https://maven.aliyun.com/repository/public}
    image: blog-java-server:${APP_VERSION:-1.0.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      # 容器内固定 8888/8889，与前端硬编码保持一致；改宿主机端口用 APP_PORT / WS_PORT
      APP_PORT: "8888"
      CHAT_WS_PORT: "8889"
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-blog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 deploy/java/.env 里设置 MYSQL_PASSWORD}
      MYSQL_DB: ${MYSQL_DB:-online_blog}
      # 显式给 Spring 标准变量：即使镜像里误带了 application-local.yml，也不会连错库
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/${MYSQL_DB:-online_blog}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-blog}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?请在 deploy/java/.env 里设置 MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请在 deploy/java/.env 里设置 JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 deploy/java/.env 里设置 ADMIN_PASSWORD}
      # oss / local / online（Java 版未实现 qiniu、minio）
      UPLOADTYPE: ${UPLOADTYPE:-oss}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME:-}
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${ALIBABA_CLOUD_ACCESS_KEY_ID:-}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:-}
      OSS_DOMAIN: ${OSS_DOMAIN:-}
      OSS_DIR: ${OSS_DIR:-images/}
      OSS_REFERER: ${OSS_REFERER:-}
      OSS_PUBLIC_READ: ${OSS_PUBLIC_READ:-true}
      JAVA_OPTS: ${JAVA_OPTS}
    volumes:
      - java_upload:/app/upload
    ports:
      - "${APP_PORT:-8888}:8888"
      - "${WS_PORT:-8889}:8889"
    networks:
      - blog-network

  nginx:
    # 固定 1.31.2：1.31.3+ 在 CentOS 7 + Docker CE 26 上写 /run/nginx.pid 会 EPERM
    # 官方 issue：https://github.com/nginx/docker-nginx/issues/1059
    image: nginx:1.31.2-alpine
    restart: unless-stopped
    depends_on:
      blog-java-server:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 整个 ui 目录挂进去：没有构建 admin 时只是 /admin/ 404，不影响 nginx 启动
      - ../../ui:/usr/share/nginx/html:ro
    networks:
      - blog-network

  # 可选：网易云音乐接口。默认不启动，需要音乐页时加 --profile music：
  #   docker compose --env-file .env --profile music up -d
  netease-music-api:
    image: binaryify/netease_cloud_music_api:latest
    profiles: ["music"]
    restart: unless-stopped
    networks:
      - blog-network

volumes:
  db_data:
  java_upload:

networks:
  blog-network:
    driver: bridge
