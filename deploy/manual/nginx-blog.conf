# /etc/nginx/conf.d/blog.conf
# 手工部署（非 Docker）用。假设：
#   前端产物  /opt/blog/ui/blog
#   管理端    /opt/blog/ui/admin
#   后端      http://127.0.0.1:8888   （/api 前缀在这里被剥掉）
#   WebSocket http://127.0.0.1:8889
server {
    listen 80;
    server_name _;

    client_max_body_size 20m;
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # ---------- 博客前台 ----------
    location / {
        root /opt/blog/ui/blog;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ---------- 后台管理端 ----------
    location /admin {
        alias /opt/blog/ui/admin;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # ---------- 后端接口（剥掉 /api 前缀）----------
    location /api/ {
        proxy_pass http://127.0.0.1:8888/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- WebSocket（首页公告/在线人数等）----------
    location /ws/ {
        proxy_pass http://127.0.0.1:8889/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ---------- MinIO 图片（UPLOADTYPE=minio 时需要）----------
    location /blog-images/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_set_header Host $host;
    }

    # ---------- 网易云音乐接口代理 ----------
    location /wapi/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
    }
}
