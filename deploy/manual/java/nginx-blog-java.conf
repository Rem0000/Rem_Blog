# /etc/nginx/conf.d/blog.conf（Java 版手工部署）
# 假设：
#   前端产物  /var/www/blog/blog
#   管理端    /var/www/blog/admin
#   后端      http://127.0.0.1:8888   （/api 前缀在这里被剥掉）
#   WebSocket http://127.0.0.1:8889
#
# 改过 WEB_DIR / APP_PORT / WS_PORT 时，同步改下面的路径和端口；
# deploy/setup-java-manual.sh 会自动按实际配置生成，不需要手工改。
server {
    listen 80;
    server_name _;

    # 上传：Java 版单文件 20MB / 请求 25MB，留出 multipart 余量
    client_max_body_size 25m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # ---------- 博客前台 ----------
    location / {
        root /var/www/blog/blog;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ---------- 后台管理端 ----------
    location = /admin {
        return 301 /admin/;
    }

    location /admin {
        alias /var/www/blog/admin;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # ---------- 后端接口（剥掉 /api 前缀）----------
    location /api/ {
        proxy_pass http://127.0.0.1:8888/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- WebSocket（聊天，独立端口 8889）----------
    location /ws/ {
        proxy_pass http://127.0.0.1:8889/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ---------- MinIO 图片（历史数据 / UPLOADTYPE=minio 时）----------
    location /blog-images/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_set_header Host $host;
    }

    # ---------- 网易云音乐接口代理 ----------
    location /wapi/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
    }
}
