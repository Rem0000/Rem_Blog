server:
  port: ${APP_PORT:8088}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: blog-server
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:online_blog}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull
    username: ${MYSQL_USER:root}
    # 不要在这里写真实密码。优先级：环境变量 MYSQL_PASSWORD > application-local.yml
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jackson:
    time-zone: Asia/Shanghai
    # 全局下划线命名：Java 驼峰字段 -> JSON 下划线，与数据库列名一致
    property-naming-strategy: SNAKE_CASE
    # 不要配置 non_null：现网会把 null 字段原样返回，省略会破坏契约
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      # 图片上传：默认 1MB 对封面图不够，Node 侧也没有限制单文件大小
      max-file-size: 20MB
      max-request-size: 25MB

mybatis-plus:
  configuration:
    # 关键：blog_name -> blogName，而 createdAt 这种本来就没下划线的保持原样
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      table-underline: true

blog:
  jwt-secret: ${JWT_SECRET:blog}
  # 内置超管账号 admin 的密码；为空时 admin 无法登录（与原实现一致）
  admin-password: ${ADMIN_PASSWORD:123}
  # oss / local / online（qiniu、minio 未实现）
  # 默认 oss；本地没有 OSS 密钥时可用 UPLOADTYPE=local 回退到落盘
  upload-type: ${UPLOADTYPE:oss}

# 阿里云 OSS（UPLOADTYPE=oss 时生效）
oss:
  # 地域节点，如 oss-cn-shanghai.aliyuncs.com
  endpoint: ${OSS_ENDPOINT:}
  # AccessKey 建议用环境变量注入，不要写进仓库
  access-key-id: ${ALIBABA_CLOUD_ACCESS_KEY_ID:}
  access-key-secret: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:}
  bucket-name: ${OSS_BUCKET_NAME:}
  # 可选：绑定到 Bucket 的自定义域名 / CDN 域名；留空用 https://<bucket>.<endpoint>
  domain: ${OSS_DOMAIN:}
  # 对象前缀
  dir: ${OSS_DIR:images/}
  # 防盗链 Referer：填 OSS 白名单里的站点地址；留空时自动用上传请求的 Origin/Referer
  referer: ${OSS_REFERER:}
  # Bucket 默认私有，博客图片需要浏览器直接访问，上传时把对象 ACL 设为公共读
  public-read: ${OSS_PUBLIC_READ:true}

springdoc:
  swagger-ui:
    path: /swagger
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: info
    com.mrzym.blog: debug
